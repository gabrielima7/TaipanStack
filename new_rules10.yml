
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 23: Catch Exception/BaseException broadly
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-catch-broad-exception
    languages: [python]
    severity: WARNING
    message: >
      Catching `Exception` or `BaseException` broadly can unintentionally mask
      system-level errors (like `SystemExit` or `KeyboardInterrupt`) or hide
      underlying bugs, making debugging difficult and potentially putting the
      system in an unpredictable state. Be specific about the exceptions you catch.
    metadata:
      category: security
      confidence: LOW
      cwe: "CWE-396: Declaration of Catch for Generic Exception"
      owasp: "A05:2021 - Security Misconfiguration"
      technology:
        - python
    patterns:
      - pattern: |
          try:
              ...
          except Exception:
              ...
      - pattern-not: |
          try:
              ...
          except Exception as $E:
              ...
              raise ...
      - pattern-not: |
          try:
              ...
          except Exception:
              ...
              raise
