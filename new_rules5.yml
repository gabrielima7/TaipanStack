
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 18: Detect dangerous use of `eval` or `exec`
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-eval-exec
    languages: [python]
    severity: ERROR
    message: >
      `eval` and `exec` functions execute arbitrary Python code. If used with untrusted input,
      this allows for complete arbitrary code execution.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
