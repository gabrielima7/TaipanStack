
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 20: Server-Side Request Forgery (SSRF) - Unvalidated requests.get()
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-requests-ssrf
    languages: [python]
    severity: ERROR
    message: >
      A function from the `requests` library is called without a static/hardcoded URL.
      Ensure the URL is validated against SSRF attacks before making the request.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      technology:
        - python
        - requests
    patterns:
      - pattern-either:
          - pattern: requests.get($URL, ...)
          - pattern: requests.post($URL, ...)
          - pattern: requests.put($URL, ...)
          - pattern: requests.delete($URL, ...)
          - pattern: requests.patch($URL, ...)
          - pattern: requests.head($URL, ...)
          - pattern: requests.options($URL, ...)
          - pattern: requests.request(..., $URL, ...)
      - pattern-not: requests.get("...", ...)
      - pattern-not: requests.post("...", ...)
      - pattern-not: requests.put("...", ...)
      - pattern-not: requests.delete("...", ...)
      - pattern-not: requests.patch("...", ...)
      - pattern-not: requests.head("...", ...)
      - pattern-not: requests.options("...", ...)
      - pattern-not: requests.request(..., "...", ...)
