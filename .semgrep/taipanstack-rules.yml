# =============================================================================
# TaipanStack — Custom Semgrep Rules
# =============================================================================
# Enforces proper error handling when using TaipanStack's Result types.
# Developers MUST handle the Err() branch when matching on Result values.
# =============================================================================

rules:
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 1: Match on Result must include `case Err(...)`
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.result-err-not-handled
    languages: [python]
    severity: WARNING
    message: >
      Missing `case Err(...)` branch in Result pattern match.
      TaipanStack requires explicit error handling for all Result values.
      Add a `case Err(error):` branch to handle the failure case.
      See: https://github.com/gabrielima7/TaipanStack#error-handling
    metadata:
      category: correctness
      confidence: HIGH
      technology:
        - taipanstack
      references:
        - https://github.com/gabrielima7/TaipanStack
    patterns:
      - pattern: |
          match $RESULT:
              case Ok($VAL):
                  ...
      - pattern-not: |
          match $RESULT:
              case Ok($VAL):
                  ...
              case Err($ERR):
                  ...
      - pattern-not: |
          match $RESULT:
              case Err($ERR):
                  ...
              case Ok($VAL):
                  ...

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 2: Do not discard the return value of @safe-decorated functions
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.result-value-discarded
    languages: [python]
    severity: WARNING
    message: >
      Return value of a function decorated with `@safe` or `@safe_from` is
      being discarded. This silently swallows potential errors. Assign the
      result to a variable and handle both Ok and Err cases.
    metadata:
      category: correctness
      confidence: MEDIUM
      technology:
        - taipanstack
    pattern-either:
      - patterns:
          - pattern: |
              @safe
              def $FUNC(...):
                  ...

              ...

              $FUNC(...)
          - pattern-not: $X = $FUNC(...)
          - pattern-not: return $FUNC(...)
          - pattern-not: yield $FUNC(...)
      - patterns:
          - pattern: |
              @safe_from(...)
              def $FUNC(...):
                  ...

              ...

              $FUNC(...)
          - pattern-not: $X = $FUNC(...)
          - pattern-not: return $FUNC(...)
          - pattern-not: yield $FUNC(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 3: Do not use bare `unwrap()` on Result without prior check
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.result-unsafe-unwrap
    languages: [python]
    severity: WARNING
    message: >
      Calling `.unwrap()` on a Result without checking `is_ok()` first can
      raise an UnwrapError at runtime. Prefer `match` with explicit
      `Ok`/`Err` handling, or use `unwrap_or()` / `unwrap_or_else()`.
    metadata:
      category: correctness
      confidence: HIGH
      technology:
        - taipanstack
    pattern: $RESULT.unwrap()

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 4: Enforce timeout on requests
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.requests-missing-timeout
    languages: [python]
    severity: ERROR
    message: >
      A `requests` call was made without a `timeout` argument.
      This can lead to a hanging process if the server never responds, causing Denial of Service.
      Always specify a `timeout` argument (e.g., `timeout=10`).
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp: "A06:2021 - Vulnerable and Outdated Components"
      technology:
        - requests
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: requests.put(...)
          - pattern: requests.delete(...)
          - pattern: requests.patch(...)
          - pattern: requests.head(...)
          - pattern: requests.options(...)
          - pattern: requests.request(...)
      - pattern-not: requests.$METHOD(..., timeout=$TIMEOUT, ...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 5: Detect insecure usage of `eval()`
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-insecure-eval
    languages: [python]
    severity: ERROR
    message: >
      The use of `eval()` is highly discouraged and can lead to arbitrary code execution
      if used with untrusted user input. Use `ast.literal_eval()` for safely evaluating
      strings containing Python expressions.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      technology:
        - python
    patterns:
      - pattern: eval(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 6: Detect insecure deserialization with pickle
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-insecure-pickle
    languages: [python]
    severity: ERROR
    message: >
      Using `pickle` to deserialize untrusted data can lead to arbitrary code
      execution. Use safer formats like JSON (`json.loads()`) for data exchange.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      technology:
        - python
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: _pickle.load(...)
      - pattern: _pickle.loads(...)
      - pattern: cPickle.load(...)
      - pattern: cPickle.loads(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 7: Detect use of $ instead of \Z in regex validation
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-regex-dollar-anchor
    languages: [python]
    severity: ERROR
    message: >
      When writing regular expressions for strict string validation in Python, specifically within
      `taipanstack.security.validators` and `taipanstack.config.models`, use the `\Z` anchor
      instead of `$` to ensure absolute string termination and prevent bypasses via trailing newline
      characters (e.g., `\n`).
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-20: Improper Input Validation"
      owasp: "A03:2021 - Injection"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: re.match($REGEX, ...)
          - pattern: re.search($REGEX, ...)
          - pattern: re.fullmatch($REGEX, ...)
          - pattern: re.compile($REGEX, ...)
      - pattern-inside: |
          $REGEX = $STR
          ...
      - metavariable-regex:
          metavariable: $STR
          regex: '.*\$[\042\047]'

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 8: Detect insecure usage of `subprocess` with `shell=True`
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >
      Using `subprocess` functions with `shell=True` is dangerous and can lead to command
      injection vulnerabilities if the command is constructed using untrusted input.
      Use a list of arguments instead (e.g., `subprocess.run(["ls", "-l"])`) or
      ensure strict validation using `taipanstack.utils.subprocess.run_safe_command`.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 9: Detect insecure XML parsing (XML External Entity - XXE)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-insecure-xml-parse
    languages: [python]
    severity: ERROR
    message: >
      The standard library XML parsers (e.g., `xml.etree.ElementTree`, `xml.dom.minidom`) are
      vulnerable to XML External Entity (XXE) attacks when parsing untrusted data.
      Use `defusedxml` to parse untrusted XML data safely.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp: "A05:2021 - Security Misconfiguration"
      technology:
        - python
    pattern-either:
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: xml.etree.ElementTree.fromstring(...)
      - pattern: xml.dom.minidom.parse(...)
      - pattern: xml.dom.minidom.parseString(...)
      - pattern: xml.sax.parse(...)
      - pattern: xml.sax.parseString(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 10: Detect insecure usage of `json.loads` without error handling
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-unhandled-json-loads
    languages: [python]
    severity: WARNING
    message: >
      `json.loads` can raise `json.JSONDecodeError` on malformed input. Ensure
      that it is wrapped in a try/except block or that you are using a safe wrapper
      if the input comes from an untrusted source, to avoid Denial of Service via unhandled exceptions.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-755: Improper Handling of Exceptional Conditions"
      owasp: "A05:2021 - Security Misconfiguration"
      technology:
        - python
    patterns:
      - pattern: json.loads(...)
      - pattern-not-inside: |
          try:
              ...
          except ...:
              ...
      - pattern-not-inside: |
          with pytest.raises(...):
              ...

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 11: Detect insecure usage of yaml.load without SafeLoader
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-insecure-yaml-load
    languages: [python]
    severity: ERROR
    message: >
      Using `yaml.load()` without specifying a safe loader allows for arbitrary code
      execution. This is a critical security risk (Insecure Deserialization).
      Always use `yaml.safe_load()` or specify `Loader=yaml.SafeLoader` in `yaml.load()`.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      technology:
        - python
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 12: Detect insecure cryptographic hash functions
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-weak-hash-md5-sha1
    languages: [python]
    severity: WARNING
    message: >
      MD5 and SHA1 hash algorithms are considered cryptographically weak and
      are susceptible to collision attacks. They should not be used for security
      purposes (like password hashing or digital signatures). Prefer SHA-256 or
      SHA-3 variants.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      technology:
        - python
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 13: Prevent insecure comparison in JWT algorithms (Timing attacks & none bypass)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-jwt-insecure-algorithm-check
    languages: [python]
    severity: ERROR
    message: >
      Using `==` or `!=` to validate algorithms (like the "none" bypass check) can be
      vulnerable to timing attacks or obfuscation bypasses if not done via constant-time
      comparison. Use `secrets.compare_digest` when checking critical security strings
      like "none", algorithm names, or hashes.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-208: Observable Timing Discrepancy"
      owasp: "A02:2021 - Cryptographic Failures"
      technology:
        - python
        - jwt
    patterns:
      - pattern-either:
          - pattern: $X == "none"
          - pattern: '"none" == $X'
          - pattern: $X != "none"
          - pattern: '"none" != $X'

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 31: Missing `timeout` argument in subprocess functions
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-subprocess-missing-timeout
    languages: [python]
    severity: WARNING
    message: >
      Calling `subprocess` functions without a `timeout` argument can lead to Denial of Service (DoS)
      if the external process hangs indefinitely. Always provide a reasonable `timeout` when
      calling external commands.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp: "A06:2021 - Vulnerable and Outdated Components"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.check_output(...)
          - pattern: subprocess.run(...)
      - pattern-not: subprocess.call(..., timeout=$TIMEOUT, ...)
      - pattern-not: subprocess.check_call(..., timeout=$TIMEOUT, ...)
      - pattern-not: subprocess.check_output(..., timeout=$TIMEOUT, ...)
      - pattern-not: subprocess.run(..., timeout=$TIMEOUT, ...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 32: Detect insecure usage of os.system
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-os-system-usage
    languages: [python]
    severity: ERROR
    message: >
      Using `os.system()` is inherently dangerous because it executes the command
      in a shell, which is susceptible to OS Command Injection if the command
      string contains untrusted input. Use `taipanstack.utils.subprocess.run_safe_command`
      instead.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      technology:
        - python
    patterns:
      - pattern: os.system(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 33: Detect usage of mkstemp without secure permissions or context manager
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-insecure-mkstemp
    languages: [python]
    severity: ERROR
    message: >
      `tempfile.mkstemp` returns a tuple containing an OS-level file descriptor and a file path.
      If the file descriptor is not properly closed or wrapped in `os.fdopen()`, it can cause resource
      leaks or file descriptor reuse vulnerabilities (TOCTOU). Ensure the file descriptor is correctly handled.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-404: Improper Resource Shutdown or Release"
      owasp: "A04:2021 - Insecure Design"
      technology:
        - python
    patterns:
      - pattern: tempfile.mkstemp(...)
      - pattern-not-inside: |
          $FD, $PATH = tempfile.mkstemp(...)
          ...
          os.close($FD)
      - pattern-not-inside: |
          $FD, $PATH = tempfile.mkstemp(...)
          ...
          with os.fdopen($FD, ...) as $F:
              ...

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 34: Detect insecure directory creation with parents=True and explicit mode
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-insecure-mkdir-mode
    languages: [python]
    severity: ERROR
    message: >
      Using `Path.mkdir(parents=True, mode=...)` or `os.makedirs(..., mode=...)` applies
      the explicit mode only to the leaf directory. Intermediate parent directories are
      created with the default OS umask, which may result in overly permissive access
      rights, allowing an attacker to hijack the intermediate directories. Instead,
      create missing parent directories iteratively and apply the intended mode to each.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      owasp: "A01:2021 - Broken Access Control"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: $PATH.mkdir(..., parents=True, ..., mode=$MODE, ...)
          - pattern: os.makedirs(..., mode=$MODE, ...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 35: Missing `timeout` argument in httpx calls
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.httpx-missing-timeout
    languages: [python]
    severity: ERROR
    message: >
      An `httpx` call was made without a `timeout` argument.
      This can lead to a hanging process if the server never responds, causing Denial of Service.
      Always specify a `timeout` argument (e.g., `timeout=10`).
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp: "A06:2021 - Vulnerable and Outdated Components"
      technology:
        - httpx
    patterns:
      - pattern-either:
          - pattern: httpx.get(...)
          - pattern: httpx.post(...)
          - pattern: httpx.put(...)
          - pattern: httpx.delete(...)
          - pattern: httpx.patch(...)
          - pattern: httpx.head(...)
          - pattern: httpx.options(...)
          - pattern: httpx.request(...)
          - pattern: httpx.AsyncClient(...)
          - pattern: httpx.Client(...)
      - pattern-not: httpx.$METHOD(..., timeout=$TIMEOUT, ...)
      - pattern-not: httpx.AsyncClient(..., timeout=$TIMEOUT, ...)
      - pattern-not: httpx.Client(..., timeout=$TIMEOUT, ...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 36: Enforce SafeHttpClient over direct httpx usage
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.use-safe-http-client
    languages: [python]
    severity: WARNING
    message: >
      Direct use of `httpx` is discouraged. Use `taipanstack.bridges.http_bridge.SafeHttpClient`
      or `safe_request` to ensure SSRF protections and timeouts are applied.
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - httpx
        - taipanstack
    patterns:
      - pattern-either:
          - pattern: httpx.get(...)
          - pattern: httpx.post(...)
          - pattern: httpx.put(...)
          - pattern: httpx.delete(...)
          - pattern: httpx.patch(...)
          - pattern: httpx.head(...)
          - pattern: httpx.options(...)
          - pattern: httpx.request(...)
          - pattern: httpx.AsyncClient(...)
          - pattern: httpx.Client(...)
      - pattern-not-inside: |
          class SafeHttpClient:
              ...
      - pattern-not-inside: |
          async def safe_request(...):
              ...

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 37: Enforce urlsplit over urlparse for SSRF and general parsing
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-urlparse-ssrf
    languages: [python]
    severity: WARNING
    message: >
      Using `urllib.parse.urlparse` can be slower and sometimes less secure than
      `urllib.parse.urlsplit` when path parameters are not needed. Prefer `urlsplit`
      for improved execution speed and to mitigate certain URL parsing inconsistencies
      in SSRF validation.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: urllib.parse.urlparse(...)
          - pattern: urlparse(...)
      - pattern-not: urllib.parse.urlsplit(...)
      - pattern-not: urlsplit(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 38: Prevent unbounded time.sleep and asyncio.sleep
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-time-sleep
    languages: [python]
    severity: ERROR
    message: >
      Passing an unbounded or extremely large calculated delay to `time.sleep()`
      or `asyncio.sleep()` can cause an `OverflowError` (timestamp out of range for
      platform time_t) or a Denial of Service. Always clamp the delay using `min(delay, MAX_DELAY)`.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp: "A05:2021 - Security Misconfiguration"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: time.sleep($DELAY)
          - pattern: asyncio.sleep($DELAY)
      - pattern-not: time.sleep(min(...))
      - pattern-not: asyncio.sleep(min(...))
      - pattern-not-inside: |
          $DELAY = min(...)
          ...

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 39: Detect unsafe tarfile.extractall (Zip Slip / Path Traversal)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-unsafe-tarfile-extractall
    languages: [python]
    severity: ERROR
    message: >
      Calling `tarfile.extractall()` without safely filtering members can lead to Path Traversal
      (Zip Slip), allowing an attacker to write files anywhere on the filesystem.
      Pass a safe `filter` argument (e.g., `filter="data"` or a custom validation function).
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      technology:
        - python
    patterns:
      - pattern: $TAR.extractall(...)
      - pattern-not: $TAR.extractall(..., filter=$FILTER, ...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 40: Detect unsafe zipfile.extractall (Zip Slip / Path Traversal)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-unsafe-zipfile-extractall
    languages: [python]
    severity: WARNING
    message: >
      Calling `zipfile.extractall()` on untrusted archives can lead to Path Traversal
      (Zip Slip) vulnerabilities if the archive contains malicious paths. While Python 3.12+
      has improved defenses, ensure paths are strictly validated before extraction when handling
      untrusted ZIP files.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      technology:
        - python
    patterns:
      - pattern: $ZIP.extractall(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 41: Detect insecure usage of `random` module
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-insecure-random
    languages: [python]
    severity: ERROR
    message: >
      The standard `random` module is not cryptographically secure. Use `secrets`
      or `random.SystemRandom()` for security-sensitive operations (e.g., tokens,
      passwords, session keys). If this is strictly for non-cryptographic purposes
      (like jitter), consider using `secrets.SystemRandom()` anyway to maintain a
      clean security baseline.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: random.random(...)
          - pattern: random.randint(...)
          - pattern: random.randrange(...)
          - pattern: random.choice(...)
          - pattern: random.choices(...)
          - pattern: random.sample(...)
          - pattern: random.uniform(...)
          - pattern: random.shuffle(...)
      - pattern-not-inside: |
          random.SystemRandom().$METHOD(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 42: Detect insecure use of `str` for passwords/secrets in Pydantic models
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-pydantic-secretstr
    languages: [python]
    severity: WARNING
    message: >
      Pydantic model fields that store sensitive information (e.g., passwords,
      secrets, tokens) should use `pydantic.SecretStr` or `pydantic.SecretBytes`
      instead of `str` or `bytes`. This prevents accidental leakage of sensitive
      data in logs, tracebacks, or API responses when models are serialized.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      technology:
        - python
        - pydantic
    patterns:
      - pattern-inside: |
          class $MODEL(..., BaseModel, ...):
              ...
      - pattern-either:
          - pattern: "password: str"
          - pattern: "secret: str"
          - pattern: "token: str"
          - pattern: "api_key: str"

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 43: Detect unsafe `shutil.rmtree` with `ignore_errors=True`
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-shutil-rmtree-ignore-errors
    languages: [python]
    severity: WARNING
    message: >
      Using `shutil.rmtree(..., ignore_errors=True)` ignores all errors during
      directory deletion. If this directory contains sensitive temporary files,
      failing to delete them silently could leave sensitive data on the disk
      (e.g., TOCTOU vulnerabilities or incomplete cleanup). Handle errors explicitly.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-14: Compiler Removal of Code to Clear Buffers"
