
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 14: Detect dangerous use of xml.etree.ElementTree (vulnerable to XXE)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-xxe-xml-etree
    languages: [python]
    severity: ERROR
    message: >
      The standard library `xml.etree.ElementTree` is vulnerable to XML External Entity (XXE) attacks.
      Use `defusedxml.ElementTree` instead if parsing untrusted data, or strictly sanitize.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp: "A05:2021 - Security Misconfiguration"
      technology:
        - python
    patterns:
      - pattern: xml.etree.ElementTree.parse(...)

  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 15: Weak random number generation for security-sensitive purposes
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-weak-random
    languages: [python]
    severity: WARNING
    message: >
      Using the standard `random` module for generating security-sensitive tokens, passwords, or
      cryptographic keys is unsafe because it is a predictable pseudo-random number generator (PRNG).
      Use the `secrets` module instead for cryptographically strong random numbers.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp: "A02:2021 - Cryptographic Failures"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: random.random(...)
          - pattern: random.randint(...)
          - pattern: random.choice(...)
          - pattern: random.choices(...)
          - pattern: random.sample(...)
          - pattern: random.randrange(...)
