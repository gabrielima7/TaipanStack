
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 29: Use of urllib.parse.urlparse without scheme validation
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-urlparse-no-scheme-validation
    languages: [python]
    severity: WARNING
    message: >
      When parsing URLs with `urllib.parse.urlparse`, the scheme must be validated
      to ensure it is an allowed scheme (e.g., 'http', 'https'). Lack of scheme
      validation can lead to SSRF, open redirects, or bypasses.
    metadata:
      category: security
      confidence: LOW
      cwe: "CWE-436: Interpretation Conflict"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      technology:
        - python
    patterns:
      - pattern: urlparse(...)
      - pattern-not-inside: |
          ...
          if $P.scheme in ...:
              ...
      - pattern-not-inside: |
          ...
          if $P.scheme not in ...:
              ...
