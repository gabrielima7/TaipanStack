
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 28: Insecure temporary directory handling
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-tempdir-path-traversal
    languages: [python]
    severity: WARNING
    message: >
      Using string operations like `os.path.join()` or f-strings with `tempfile.gettempdir()`
      can lead to path traversal vulnerabilities if untrusted input is included.
      Use `pathlib.Path` with `.resolve()` to sanitize the input.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: os.path.join(tempfile.gettempdir(), ...)
          - pattern: f"{tempfile.gettempdir()}/..."
          - pattern: f"{tempfile.gettempdir()}\\..."
