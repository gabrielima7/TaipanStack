
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 22: Detect hardcoded random seed
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-hardcoded-random-seed
    languages: [python]
    severity: WARNING
    message: >
      Using a hardcoded or predictable random seed (e.g. random.seed(0)) completely breaks the unpredictability of
      pseudo-random number generators. This can be exploited if used for security purposes.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-330: Use of Insufficiently Random Values"
      owasp: "A02:2021 - Cryptographic Failures"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: random.seed($X)
          - pattern: numpy.random.seed($X)
      - metavariable-regex:
          metavariable: $X
          regex: "^(?!None).*" # $X is not None
