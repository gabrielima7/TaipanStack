
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 24: Missing timeout on network requests
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-missing-timeout
    languages: [python]
    severity: ERROR
    message: >
      Network requests must always have a `timeout` explicitly specified to prevent
      resource exhaustion and potential denial-of-service (DoS) vectors when communicating
      with slow or malicious servers.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      owasp: "A06:2021 - Vulnerable and Outdated Components"
      technology:
        - requests
        - urllib
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: requests.put(...)
          - pattern: requests.delete(...)
          - pattern: requests.patch(...)
          - pattern: requests.request(...)
          - pattern: urllib.request.urlopen(...)
      - pattern-not: requests.get(..., timeout=$T, ...)
      - pattern-not: requests.post(..., timeout=$T, ...)
      - pattern-not: requests.put(..., timeout=$T, ...)
      - pattern-not: requests.delete(..., timeout=$T, ...)
      - pattern-not: requests.patch(..., timeout=$T, ...)
      - pattern-not: requests.request(..., timeout=$T, ...)
      - pattern-not: urllib.request.urlopen(..., timeout=$T, ...)
