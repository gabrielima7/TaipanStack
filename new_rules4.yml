
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 17: Detect hardcoded credentials
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-hardcoded-credentials
    languages: [python]
    severity: WARNING
    message: >
      A secret is hard-coded in the application. Secrets gathered from user input, configuration
      files, or environment variables are more secure.
    metadata:
      category: security
      confidence: LOW
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: password = "$PWD"
          - pattern: token = "$PWD"
          - pattern: api_key = "$PWD"
          - pattern: secret = "$PWD"
      - metavariable-regex:
          metavariable: $PWD
          regex: ".*"
