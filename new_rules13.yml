
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 26: Insecure Temporary File Creation
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-mktemp
    languages: [python]
    severity: ERROR
    message: >
      `tempfile.mktemp` is deprecated and vulnerable to race conditions that can lead
      to privilege escalation or malicious file overrides. Use `NamedTemporaryFile`
      or `mkstemp` instead.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-377: Insecure Temporary File"
      owasp: "A01:2021 - Broken Access Control"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: tempfile.mktemp(...)
          - pattern: mktemp(...)
