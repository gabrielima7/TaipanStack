
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 27: Catch Exception broadly and use pass
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-catch-broad-exception-pass
    languages: [python]
    severity: ERROR
    message: >
      Catching `Exception` broadly and silently passing can hide errors, leaving
      the program in an unknown state.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-390: Detection of Error Condition Without Action"
      owasp: "A05:2021 - Security Misconfiguration"
      technology:
        - python
    patterns:
      - pattern: |
          try:
              ...
          except Exception:
              pass
