[project]
name = "taipanstack"
version = "0.4.9"
description = "TaipanStack - Modular, secure, and scalable Python stack for robust development"
authors = [
    {name = "gabrielima7", email = "gabrielima.alu.lmb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
keywords = ["security", "devops", "python", "taipanstack", "bootstrapper", "quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic (>=2.0)",
    "pydantic-settings (>=2.0.0)",
    "orjson (>=3.9.0)",
    "email-validator (>=2.0.0)",
    "result (>=0.17.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pip (>=26.1,<27.0)",
]

[project.urls]
Homepage = "https://github.com/gabrielima7/TaipanStack"
Documentation = "https://gabrielima7.github.io/TaipanStack/"
Repository = "https://github.com/gabrielima7/TaipanStack"
Changelog = "https://github.com/gabrielima7/TaipanStack/blob/main/CHANGELOG.md"
Issues = "https://github.com/gabrielima7/TaipanStack/issues"


[project.optional-dependencies]
runtime = [
    "uvloop (>=0.19.0); sys_platform != 'win32'",
    "structlog (>=23.0.0)",
]
bridges-web = [
    "fastapi (>=0.100.0)",
    "litestar (>=2.0.0)",
]
bridges-http = [
    "httpx (>=0.24.0)",
]
bridges-db = [
    "sqlalchemy (>=2.0.0)",
    "redis (>=5.0.0)",
]
resilience = [
    "psutil (>=5.9.0)",
]
all = [
    # runtime
    "uvloop (>=0.19.0); sys_platform != 'win32'",
    "structlog (>=23.0.0)",
    # bridges-web
    "fastapi (>=0.100.0)",
    "litestar (>=2.0.0)",
    # bridges-http
    "httpx (>=0.24.0)",
    # bridges-db
    "sqlalchemy (>=2.0.0)",
    "redis (>=5.0.0)",
    # resilience
    "psutil (>=5.9.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.8.0)",
    "mypy (>=1.10.0)",
    "bandit (>=1.7.0)",
    "pre-commit (>=3.7.0)",
    "pytest (>=9.0.3)",
    "pytest-cov (>=5.0.0)",
    "pytest-timeout (>=2.3.0)",
    "pytest-xdist (>=3.6.0)",
    "vulture (>=2.11)",
    "polyfactory (>=2.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "import-linter (>=2.1)",
    "gitingest (>=0.1.0)",
    "pytest-asyncio (>=0.23.0)",

    "pip-audit (>=2.10.0,<3.0.0)",
    # Security: CVE fix - requests <2.33.0 has insecure temp file reuse (CWE-377)
    # Dependabot alert #17 - CVSS 4.4/10 Moderate
    "requests (>=2.33.0)",
    # Security note: Pygments <=2.19.2 has ReDoS via AdILexer (Dependabot alert #16)
    # CVSS 1.9/10 Low - local attack vector only, no upstream patch available yet
    # Pinned to latest available; monitor for upstream fix in pygments >2.19.2
    "pygments (>=2.19.2)",
    "hypothesis (>=6.151.12,<7.0.0)",
    "authlib (>=1.6.11,<2.0.0)",
    "cryptography (>=46.0.7,<49.0.0)",
    "nltk (>=3.9.4,<4.0.0)",
    "mutmut (>=3.0.0,<4.0.0)",
    "pip (>=26.1,<27.0)",
    "pytest-benchmark (>=5.2.3,<6.0.0)",
    "cyclonedx-python-lib (>=11.7.0,<12.0.0)",
]




# --- TaipanStack v2.0 Quality Configuration ---
docs = [
    "mkdocs-material (>=9.7.3,<10.0.0)",
    "mkdocstrings[python] (>=1.0.3,<2.0.0)"
]
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "Q",    # flake8-quotes
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PIE",  # flake8-pie
    "PLC",  # Pylint Convention
    "PLE",  # Pylint Error
    "PLR",  # Pylint Refactor
    "PLW",  # Pylint Warning
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "ERA",  # eradicate
    "TRY",  # tryceratops
]
ignore = ["D203", "D212", "D213", "D416", "D417", "TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests: allow asserts, skip docs, magic values, unused args, long lines, shadowing builtins
"tests/**/*.py" = ["S101", "S105", "S106", "D", "PLR2004", "ARG001", "ARG002", "SIM117", "RUF043", "PLC0415", "E501", "A004", "TRY301", "UP024"]
# TaipanStack bootstrapper: allow print, long lines, complex branches, docstring style, unused args
"taipanstack_bootstrapper.py" = ["T201", "E501", "PLR0912", "TRY300", "S603", "D205", "ARG001"]
# Utils: allow too many args, subprocess, random for jitter
"src/taipanstack/utils/*.py" = ["PLR0913", "S603", "TRY300", "S311", "TRY400"]
# Config generators: allow long lines in generated content
"src/taipanstack/config/generators.py" = ["E501"]
# Sanitizers: allow many branches for complex validation logic
"src/taipanstack/security/sanitizers.py" = ["PLR0912"]
# Decorators: allow inline imports for lazy loading, unused signal args, D401 imperative mood
"src/taipanstack/security/decorators.py" = ["PLC0415", "ARG001", "D401"]
# Core result: allow D401 for utility function docstrings
"src/taipanstack/core/result.py" = ["D401"]
# Resilience module: allow D401, too many args, random for jitter
"src/taipanstack/resilience/*.py" = ["PLR0913", "D401", "S311", "TRY300", "TRY400"]
"src/taipanstack/resilience/watchdogs/*.py" = ["PLR0913", "D401", "TRY300", "TRY400"]
"src/taipanstack/resilience/adaptive/*.py" = ["PLR0913", "PLR0912", "D401", "TRY300", "TRY400"]
"src/taipanstack/bridges/*.py" = ["PLR0913", "D401", "TRY300", "TRY400", "ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-cast", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
        "mutmut.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --timeout=30 --cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "security: marks tests as security-related",
    "integration: marks tests as integration tests",
]
filterwarnings = [

    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [

    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
    "def __call__\\(.*\\) -> .*:\\s*(?:\"\"\".*?\"\"\"\\s*)?\\.\\.\\.",
]
partial_branches = [

    "case Err\\(",
    "case Ok\\(",
]
fail_under = 100
show_missing = true


[tool.vulture]
min_confidence = 80
paths = ["src"]



[tool.mutmut]
paths_to_mutate = ["src/taipanstack/security/sanitizers.py", "src/taipanstack/security/validators.py", "src/taipanstack/security/guards.py", "src/taipanstack/resilience/retry.py", "src/taipanstack/resilience/circuit_breaker.py"]
tests_dir = ["tests/test_property_sanitizers_operations.py", "tests/test_security_validators_operations.py", "tests/test_security_guards_operations.py", "tests/test_security_ssrf_operations.py", "tests/test_utils_retry_operations.py", "tests/test_utils_circuit_breaker_operations.py"]
also_copy = ["src/"]
runner = "python -m pytest -x -q --tb=no --timeout=10 --no-cov"

