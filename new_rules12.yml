
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule 25: Detect unsanitized path traversal via string formatting
  # ─────────────────────────────────────────────────────────────────────────────
  - id: taipanstack.security-path-traversal-fstring
    languages: [python]
    severity: ERROR
    message: >
      Constructing file paths via f-strings or `.format()` with variable inputs can lead
      to Path Traversal vulnerabilities if the inputs contain `../` or `..\\`. Use `pathlib.Path`
      with strict `.resolve()` checks or sanitize variables prior to concatenation.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      technology:
        - python
    patterns:
      - pattern-either:
          - pattern: open(f"...{$X}...", ...)
          - pattern: open("...{}...".format($X), ...)
          - pattern: open("...%s..." % $X, ...)
